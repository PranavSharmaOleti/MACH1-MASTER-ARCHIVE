<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#f1f0ea" stroke="none" stroke-width="1"/><text x="116" y="102" fill="#2d232e" font-family="Courier New, monospace" font-size="16px" font-weight="700" letter-spacing="3px" text-anchor="start">MACH1  ·  FLEETLINE E1</text><text x="116" y="137" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="34px" font-weight="700" letter-spacing="0px" text-anchor="start">The argument, in six steps</text><text x="1857" y="101" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15px" font-weight="500" letter-spacing="1.5px" text-anchor="end">SYNTHESIS</text><text x="1857" y="126" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0.5px" text-anchor="end">DELHI · 200 KM/DAY</text><line x1="46" y1="151" x2="1875" y2="151" stroke="#2d232e" stroke-width="1.5"/><line x1="68" y1="199" x2="68" y2="864" stroke="#2d232e" stroke-width="2"/><rect x="115" y="162" width="1750" height="73" rx="0" fill="#e0ddcf" stroke="#2d232e" stroke-width="1.4"/><rect x="115" y="162" width="4" height="73" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><rect x="53" y="183" width="30" height="30" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><text x="68" y="204" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0px" text-anchor="middle">1</text><text x="142" y="185" fill="#2d232e" font-family="Courier New, monospace" font-size="15px" font-weight="700" letter-spacing="2.5px" text-anchor="start">THE PROBLEM</text><text x="142" y="207" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.3px" font-weight="400" letter-spacing="0px" text-anchor="start">Indian ride-hailing fleets run on CNG — not by preference, because nothing was built for their duty cycle. Fleet duty is 200 km/day, 312 days a year,</text><text x="142" y="228" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.3px" font-weight="400" letter-spacing="0px" text-anchor="start">return-to-base every night. It is the most demanding duty cycle an EV can have, and the one the Indian market has served worst.</text><rect x="115" y="243" width="1750" height="164" rx="0" fill="#f1f0ea" stroke="#2d232e" stroke-width="1.4"/><rect x="115" y="243" width="4" height="164" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><rect x="53" y="310" width="30" height="30" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><text x="68" y="331" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0px" text-anchor="middle">2</text><text x="142" y="266" fill="#2d232e" font-family="Courier New, monospace" font-size="15px" font-weight="700" letter-spacing="2.5px" text-anchor="start">THE INSIGHT — THE PIVOT</text><text x="142" y="289" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.5px" font-weight="400" letter-spacing="0px" text-anchor="start">Volume and margin live in different segments, and they need different vehicles.</text><rect x="142" y="299" width="823" height="76" rx="0" fill="#f1f0ea" stroke="#2d232e" stroke-width="1.2"/><rect x="984" y="299" width="866" height="76" rx="0" fill="#e0ddcf" stroke="#2d232e" stroke-width="1.6"/><rect x="157" y="308" width="104" height="25" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><text x="209" y="326" fill="#f1f0ea" font-family="Courier New, monospace" font-size="13.5px" font-weight="700" letter-spacing="1.3px" text-anchor="middle">VOLUME</text><text x="278" y="326" fill="#2d232e" font-family="Courier New, monospace" font-size="14.5px" font-weight="700" letter-spacing="1.4px" text-anchor="start">NOT THE LAUNCH SEGMENT</text><rect x="1000" y="308" width="106" height="25" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><text x="1053" y="326" fill="#f1f0ea" font-family="Courier New, monospace" font-size="13.5px" font-weight="700" letter-spacing="1.3px" text-anchor="middle">MARGIN</text><text x="1123" y="326" fill="#2d232e" font-family="Courier New, monospace" font-size="14.5px" font-weight="700" letter-spacing="1.4px" text-anchor="start">THE LAUNCH SEGMENT</text><text x="160" y="350" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.2px" font-weight="400" letter-spacing="0px" text-anchor="start">▪  street-hail intra-city · ~58% of rides</text><text x="160" y="369" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.2px" font-weight="400" letter-spacing="0px" text-anchor="start">▪  unpredictable dispatch · price sensitivity 0.85 · ~10% EV adoption</text><text x="1001" y="350" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.2px" font-weight="700" letter-spacing="0px" text-anchor="start">▪  airport + corporate commute · ~19% combined</text><text x="1001" y="369" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="14.5px" font-weight="700" letter-spacing="0px" text-anchor="start">▪  144–210 paid km/day · pre-booked   |   ▪  price sensitivity 0.30–0.35 · ~18% EV adoption</text><rect x="142" y="384" width="1708" height="16" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><text x="156" y="397" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="14.5px" font-weight="700" letter-spacing="0px" text-anchor="start">We did not chase the largest segment. We launched where the economics close and EV adoption already exists.</text><rect x="115" y="414" width="1750" height="69" rx="0" fill="#e0ddcf" stroke="#2d232e" stroke-width="1.4"/><rect x="115" y="414" width="4" height="69" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><rect x="53" y="433" width="30" height="30" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><text x="68" y="454" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0px" text-anchor="middle">3</text><text x="142" y="436" fill="#2d232e" font-family="Courier New, monospace" font-size="15px" font-weight="700" letter-spacing="2.5px" text-anchor="start">THE VEHICLE</text><text x="142" y="458" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.2px"><tspan font-weight="400">BEV · LFP 45 kWh · PMSM 80 bhp · </tspan><tspan font-weight="700">268 km at 15% reserve (315 km at zero) · 3,995 mm</tspan><tspan font-weight="400"> — deliberately 5 mm inside the small-car tax line.</tspan></text><text x="142" y="479" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.2px"><tspan font-weight="400">Designed around one number: </tspan><tspan font-weight="700">200 km/day</tspan><tspan font-weight="400">, return-to-base, one </tspan><tspan font-weight="700">7.4 kW AC port</tspan><tspan font-weight="400">, overnight.</tspan></text><rect x="115" y="490" width="1750" height="222" rx="0" fill="#e0ddcf" stroke="#2d232e" stroke-width="1.4"/><rect x="115" y="490" width="4" height="222" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><rect x="53" y="585" width="30" height="30" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><text x="68" y="606" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0px" text-anchor="middle">4</text><text x="142" y="515" fill="#2d232e" font-family="Courier New, monospace" font-size="15px" font-weight="700" letter-spacing="2.5px" text-anchor="start">THE MATH</text><text x="142" y="538" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.4px"><tspan font-weight="400">NPV at a </tspan><tspan font-weight="700">12%</tspan><tspan font-weight="400"> hurdle, escalated, with the </tspan><tspan font-weight="700">₹99,000/vehicle depot charger</tspan><tspan font-weight="400"> inside the cost boundary.</tspan></text><line x1="976" y1="552" x2="976" y2="698" stroke="#2d232e" stroke-width="1.2"/><rect x="142" y="557" width="820" height="31" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><line x1="302" y1="557" x2="302" y2="674" stroke="#f1f0ea" stroke-width="1.2"/><line x1="522" y1="557" x2="522" y2="674" stroke="#f1f0ea" stroke-width="1.2"/><line x1="742" y1="557" x2="742" y2="674" stroke="#f1f0ea" stroke-width="1.2"/><text x="412.0" y="578" fill="#f1f0ea" font-family="Courier New, monospace" font-size="14.5px" font-weight="700" letter-spacing="1.5px" text-anchor="middle">DELHI</text><text x="632.0" y="578" fill="#f1f0ea" font-family="Courier New, monospace" font-size="14.5px" font-weight="700" letter-spacing="1.5px" text-anchor="middle">MUMBAI</text><text x="852.0" y="578" fill="#f1f0ea" font-family="Courier New, monospace" font-size="14.5px" font-weight="700" letter-spacing="1.3px" text-anchor="middle">BENGALURU</text><rect x="142" y="588" width="820" height="43" rx="0" fill="#f1f0ea" stroke="#2d232e" stroke-width="1"/><rect x="142" y="631" width="820" height="43" rx="0" fill="#f1f0ea" stroke="#2d232e" stroke-width="1"/><rect x="302" y="588" width="220" height="86" rx="0" fill="#e0ddcf" stroke="none" stroke-width="1"/><line x1="302" y1="588" x2="302" y2="674" stroke="#2d232e" stroke-width="0.9"/><line x1="522" y1="588" x2="522" y2="674" stroke="#2d232e" stroke-width="0.9"/><line x1="742" y1="588" x2="742" y2="674" stroke="#2d232e" stroke-width="0.9"/><line x1="142" y1="631" x2="962" y2="631" stroke="#2d232e" stroke-width="0.9"/><text x="162" y="615" fill="#2d232e" font-family="Courier New, monospace" font-size="15.5px" font-weight="700" letter-spacing="0px" text-anchor="start">5-year</text><text x="162" y="658" fill="#2d232e" font-family="Courier New, monospace" font-size="15.5px" font-weight="700" letter-spacing="0px" text-anchor="start">8-year</text><text x="412.0" y="616" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" letter-spacing="0px" text-anchor="middle">+6.7%</text><text x="632.0" y="616" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" letter-spacing="0px" text-anchor="middle">+4.0%</text><text x="852.0" y="616" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" letter-spacing="0px" text-anchor="middle">+0.9%</text><text x="412.0" y="659" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" letter-spacing="0px" text-anchor="middle">+14.6%</text><text x="632.0" y="659" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" letter-spacing="0px" text-anchor="middle">+10.6%</text><text x="852.0" y="659" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="21px" font-weight="700" letter-spacing="0px" text-anchor="middle">+9.0%</text><text x="1000" y="565" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.0px" font-weight="400" letter-spacing="0px" text-anchor="start">All three clear at five years. One cell in the whole 48-cell model is negative —</text><text x="1000" y="585" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.0px"><tspan font-weight="400">Bengaluru, bought cash, </tspan><tspan font-weight="700">−0.4%.</tspan></text><text x="1000" y="610" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="14.7px" font-weight="400" letter-spacing="0px" text-anchor="start">Broker and platform fees are identical on either powertrain, so the EV-vs-CNG</text><text x="1000" y="630" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="14.7px" font-weight="400" letter-spacing="0px" text-anchor="start">difference is unaffected by how commission is structured.</text><text x="1000" y="655" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="14.5px"><tspan font-weight="700">Inter-city: </tspan><tspan font-weight="400">Delhi–Agra 200, Mumbai–Pune 150, Mumbai–Nashik 170, Bengaluru–Mysuru 145</tspan></text><text x="1000" y="675" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="14.5px" font-weight="400" letter-spacing="0px" text-anchor="start">all fit inside the 268 km envelope. Delhi–Jaipur 280 is marginal. Beyond ~300 km,</text><text x="1000" y="695" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="14.5px" font-weight="400" letter-spacing="0px" text-anchor="start">destination charging is a fleet-contract requirement, not a vehicle spec.</text><rect x="115" y="719" width="1750" height="58" rx="0" fill="#f1f0ea" stroke="#2d232e" stroke-width="1.4"/><rect x="115" y="719" width="4" height="58" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><rect x="53" y="733" width="30" height="30" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><text x="68" y="754" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0px" text-anchor="middle">5</text><text x="142" y="742" fill="#2d232e" font-family="Courier New, monospace" font-size="15px" font-weight="700" letter-spacing="2.5px" text-anchor="start">WHY LFP, AND WHAT WE ADMIT</text><text x="142" y="766" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.6px"><tspan font-weight="400">Published LFP studies disagree </tspan><tspan font-weight="700">3.6×</tspan><tspan font-weight="400"> on time-to-80%. So per-cell State-of-Health telemetry is specified, </tspan><tspan font-weight="700">not optional</tspan><tspan font-weight="400"> — it is the mechanism that makes an 8-year capacity-retention guarantee credible.</tspan></text><rect x="115" y="784" width="1750" height="159" rx="0" fill="#e0ddcf" stroke="#2d232e" stroke-width="1.4"/><rect x="115" y="784" width="4" height="159" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><rect x="53" y="849" width="30" height="30" rx="0" fill="#2d232e" stroke="#2d232e" stroke-width="1"/><text x="68" y="870" fill="#f1f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17px" font-weight="700" letter-spacing="0px" text-anchor="middle">6</text><text x="142" y="807" fill="#2d232e" font-family="Courier New, monospace" font-size="15px" font-weight="700" letter-spacing="2.5px" text-anchor="start">THE RISK WE CANNOT HEDGE</text><text x="142" y="829" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.4px" font-weight="400" letter-spacing="0px" text-anchor="start">No central scheme pays for an electric passenger car. PM E-DRIVE’s ₹11,900 cr covers 2W, 3W, rickshaws, ambulances, trucks, buses and charging — not 4W cars.</text><text x="142" y="851" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.4px"><tspan font-weight="400">Maharashtra does pay: </tspan><tspan font-weight="700">15% of ex-factory, capped ₹2 lakh</tspan><tspan font-weight="400">, for transport e-4W, 25,000 units.</tspan></text><rect x="142" y="864" width="1708" height="64" rx="0" fill="#e0ddcf" stroke="none" stroke-width="1"/><rect x="142" y="864" width="4" height="64" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><text x="160" y="889" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.2px" font-weight="700" letter-spacing="0px" text-anchor="start">And the concessions we do rely on — Delhi’s life-of-vehicle road-tax exemption, Maharashtra’s e-4W incentive — both expire 31 March 2030,</text><text x="160" y="913" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="15.2px" font-weight="700" letter-spacing="0px" text-anchor="start">five years before the target year. Renewing them is a policy position worth about five points, not an engineering one.</text><rect x="53" y="950" width="1812" height="44" rx="0" fill="#f1f0ea" stroke="#2d232e" stroke-width="1.2"/><rect x="53" y="950" width="4" height="44" rx="0" fill="#2d232e" stroke="none" stroke-width="1"/><text x="89" y="978" fill="#2d232e" font-family="Arial, Helvetica, sans-serif" font-size="16.0px"><tspan font-weight="700">1,000–2,000 vehicles, Delhi, </tspan><tspan font-weight="400">gated on cell supply  ·  measured duty  ·  twelve months of our own battery data.</tspan></text></svg>